<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        button { background: red; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        h2 { margin-top: 40px; }
    </style>
</head>
<body>
<h1>Admin Panel</h1>

<h2>Messages</h2>
<table id="messageTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Sender</th>
        <th>Text</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody id="messageBody">
    <!-- Используем данные из модели для отображения сообщений -->
    <tr th:each="message : ${messages}">
        <td th:text="${message.id}"></td>
        <td th:text="${message.sender}"></td>
        <td th:text="${message.content}"></td>
        <td><button onclick="deleteMessage([[${message.id}]])">Delete</button></td>
    </tr>
    </tbody>
</table>

<h2>Users</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
    </tr>
    </thead>
    <tbody>
    <!-- Для каждого пользователя из списка -->
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.role}"></td>
    </tr>
    </tbody>
</table>

<script>
    async function fetchMessages() {
        const response = await fetch('/admin/messages', {
            headers: {
                'Authorization': 'Basic ' + btoa('admin:password') // логин и пароль
            }
        });
        const messages = await response.json();
        const tbody = document.getElementById("messageBody");
        tbody.innerHTML = '';
        messages.forEach(msg => {
            const row = document.createElement("tr");
            row.innerHTML = `
        <td>${msg.id}</td>
        <td>${msg.sender}</td>
        <td>${msg.content}</td>
        <td><button onclick="deleteMessage(${msg.id})">Delete</button></td>
    `;

            tbody.appendChild(row);
        });
    }

    async function deleteMessage(id) {
        const confirmed = confirm("Are you sure you want to delete message #" + id + "?");
        if (!confirmed) return;

        const response = await fetch('/admin/messages/' + id, {
            method: 'DELETE',
            headers: {
                'Authorization': 'Basic ' + btoa('admin:password')
            }
        });

        if (response.ok) {
            alert("Deleted successfully.");
            fetchMessages();
        } else {
            alert("Error deleting message.");
        }
    }

    fetchMessages();
</script>
</body>
</html>
