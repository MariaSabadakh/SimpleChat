<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #5cb85c;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #4cae4c;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 th:text="#{login.title}">Login</h2>

    <form method="get" action="">
        <select name="lang" onchange="this.form.submit()">
            <option value="en" th:selected="${#locale.language == 'en'}">English</option>
            <option value="ru" th:selected="${#locale.language == 'ru'}">Русский</option>
        </select>
    </form>

    <!-- Ошибка при неправильном логине -->
    <p th:if="${param.error}" class="error" th:text="#{login.error}">Invalid username or password</p>

    <form th:action="@{/auth/login}" method="post">
        <input type="text" name="username" th:placeholder="#{login.username}" required />
        <input type="password" name="password" th:placeholder="#{login.password}" required />

        <button type="submit" th:text="#{login.submit}">Login</button>
    </form>

    <p>
        <span th:text="#{login.noaccount}">Don't have an account?</span>
        <a th:href="@{/auth/register}" th:text="#{login.register}">Register</a>
    </p>

</div>
</body>
</html>
